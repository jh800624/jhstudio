<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — 黃友立 Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、設計師。在聲音與物件之間，追求同一件質感。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens ── */
    :root {
      --white: #ffffff; --bg: #fafaf8; --border: #e8e8e4; --muted: #8c8c86;
      --body: #3c3c38; --heading: #0f0f0e; --accent: #0f0f0e;
      --r: 16px; --max: 1200px; --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--white); color: var(--body); -webkit-font-smoothing: antialiased; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 48px; }
    section { padding: 100px 0; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* ── Nav ── */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 48px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; transition: 0.3s; }
    .nav-links a:hover { color: var(--heading); }

    /* ── Hero ── */
    #hero { padding-top: 180px; padding-bottom: 100px; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center; }
    .hero-headline { font-size: clamp(40px, 6vw, 64px); font-weight: 300; line-height: 1.1; margin-bottom: 32px; letter-spacing: -0.04em; }
    .hero-statement { font-size: 18px; line-height: 1.8; border-left: 2px solid var(--border); padding-left: 24px; margin-bottom: 40px; }
    .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 16px 32px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.3s var(--ease); border: none; text-decoration: none; }
    .btn-dark { background: #0f0f0e; color: #fff; }
    .btn-gray { background: #f2f2ee; color: #0f0f0e; }
    .spotify-tag { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; background: #f2f2ee; border-radius: 100px; font-size: 12px; font-weight: 500; margin-bottom: 24px; }
    .spotify-dot { width: 8px; height: 8px; background: #1DB954; border-radius: 50%; box-shadow: 0 0 0 3px rgba(29,185,84,0.15); }
    .hero-photo { aspect-ratio: 4/5; border-radius: var(--r); overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.06); }
    .hero-photo-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 32px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); display: flex; flex-wrap: wrap; gap: 8px; }
    .role-tag { font-size: 10px; color: #fff; background: rgba(255,255,255,0.15); padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; }

    /* ── Work ── */
    #work { background: var(--bg); }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .work-card { border-radius: var(--r); overflow: hidden; background: var(--white); border: 1px solid var(--border); transition: 0.5s var(--ease); }
    .work-card:hover { transform: translateY(-10px); box-shadow: 0 32px 70px rgba(0,0,0,0.1); }
    .work-card.featured { grid-column: span 2; }
    .work-thumb { aspect-ratio: 4/3; position: relative; overflow: hidden; }
    .work-card.featured .work-thumb { aspect-ratio: 16/8; }
    .work-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 32px; color: #fff; z-index: 2; opacity: 0; transform: translateY(20px); transition: 0.5s var(--ease); background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
    .work-card:hover .work-overlay { opacity: 1; transform: translateY(0); }

    /* ── Contact ── */
    #contact { background: var(--white); }
    .contact-card { display: flex; align-items: center; gap: 20px; padding: 24px 32px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); text-decoration: none; transition: 0.3s; margin-bottom: 16px; max-width: 500px; }
    .contact-card:hover { transform: translateX(8px); background: var(--bg); }

    /* ── ✨ Footer (依照截圖還原顏色與排版) ── */
    footer { 
      padding: 60px 0 40px; 
      border-top: 1px solid var(--border); 
      background: var(--white); /* 依照截圖改為純白 */
    }
    .footer-inner { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-size: 13px; 
      color: var(--muted); 
    }
    .footer-brand { 
      font-weight: 500; 
      color: var(--heading); 
    }
    .footer-links { 
      display: flex; 
      gap: 24px; 
      position: absolute; 
      left: 50%; 
      transform: translateX(-50%); /* 確保連結在中間 */
    }
    .footer-links a { 
      transition: color 0.3s; 
    }
    .footer-links a:hover { 
      color: var(--heading); 
    }
    .footer-copy { 
      color: #bbbbba; /* 淺灰色字體 */
    }

    @media (max-width: 768px) {
      .hero-grid, .work-grid { grid-template-columns: 1fr; gap: 40px; }
      .nav-links { display: none; }
      .footer-inner { flex-direction: column; gap: 20px; text-align: center; }
      .footer-links { position: static; transform: none; }
    }
    .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s var(--ease); }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <nav><div class="nav-inner"><span class="nav-logo">JH Studio</span><ul class="nav-links"><li><a href="#about">About</a></li><li><a href="#work">Work</a></li><li><a href="#music">Music</a></li><li><a href="#contact">Contact</a></li></ul></div></nav>

  <section id="hero"><div class="wrap"><div class="hero-grid" id="hero-content"></div></div></section>

  <section id="about"><div class="wrap"><div class="about-grid" id="about-content"></div></div></section>

  <section id="work"><div class="wrap"><h2 style="font-size:36px; font-weight:300; margin-bottom:48px;">Portfolio</h2><div id="work-grid" class="work-grid"></div></div></section>

  <section id="music" style="background:var(--bg)"><div class="wrap"><h2 style="font-size:36px; font-weight:300; margin-bottom:48px;">Listen</h2><div id="player-wrap" style="border-radius:16px; overflow:hidden; background:#000;"></div></div></section>

  <section id="contact">
    <div class="wrap">
      <h2 style="font-size:36px; font-weight:300; margin-bottom:48px;">Say hello.</h2>
      <a href="https://www.instagram.com/jerryhang_" target="_blank" class="contact-card reveal"><div>📸 INSTAGRAM</div><div style="font-weight:500;">@jerryhang_</div></a>
      <a href="mailto:jh800624@gmail.com" class="contact-card reveal"><div>✉️ EMAIL</div><div style="font-weight:500;">jh800624@gmail.com</div></a>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div class="footer-inner">
        <div class="footer-brand">JH Studio · 黃友立 Jerry Hang</div>
        <div class="footer-links">
          <a href="https://www.instagram.com/jerryhang_" target="_blank">Instagram</a>
          <a href="mailto:jh800624@gmail.com">Email</a>
        </div>
        <div class="footer-copy">© 2025 JH Studio</div>
      </div>
    </div>
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    async function init() {
      try {
        const response = await fetch('./projects.json?t=' + Date.now());
        const data = await response.json();

        // Hero 注入
        document.getElementById('hero-content').innerHTML = `
          <div class="hero-left reveal">
            <h1 class="hero-headline">${data.hero.headline}</h1>
            <p class="hero-statement">${data.hero.statement}<span>${data.hero.statement_en}</span></p>
            <a href="#music" class="spotify-tag"><span class="spotify-dot"></span>Listen on Spotify</a>
            <div class="hero-cta"><a href="#work" class="btn btn-dark">View Work</a><a href="#contact" class="btn btn-gray">Get in Touch</a></div>
          </div>
          <div class="hero-visual reveal"><div class="hero-photo"><img src="${data.hero.photo}"><div class="hero-photo-caption">${data.hero.roles.map(r => `<span class="role-tag">${r}</span>`).join('')}</div></div></div>
        `;

        // About 注入
        document.getElementById('about-content').innerHTML = `
          <div class="about-text reveal"><h2 style="font-size:36px; font-weight:300; margin-bottom:32px;">${data.about.title}</h2><p>${data.about.p1}</p></div>
          <div class="about-facts reveal">${data.about.facts.map(f => `<div class="fact-card"><div style="font-size:32px; font-weight:300;">${f.num}</div><div style="font-size:12px; color:#8c8c86;">${f.label}</div></div>`).join('')}</div>
        `;

        // 作品渲染
        const grid = document.getElementById('work-grid');
        data.works.forEach(item => {
          const card = document.createElement('div');
          card.className = `work-card reveal ${item.featured ? 'featured' : ''}`;
          card.innerHTML = `<div class="work-thumb"><img src="${item.image}"><div class="work-overlay"><strong>${item.name}</strong><p style="font-size:12px; margin-top:12px;">${item.note || ''}</p></div></div><div class="work-info"><p style="font-size:11px; color:#8c8c86;">${item.date}</p><p style="font-size:14px; font-weight:500;">${item.name}</p></div>`;
          grid.appendChild(card);
          observer.observe(card);
        });

        // Spotify 渲染
        if (data.spotify) {
          document.getElementById('player-wrap').innerHTML = `<iframe src="https://open.spotify.com/embed/playlist/${data.spotify[0]}" width="100%" height="400" frameborder="0" allowfullscreen></iframe>`;
        }

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
      } catch (err) { console.error(err); }
    }
    init();
  </script>
</body>
</html>
