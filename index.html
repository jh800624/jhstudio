<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂、設計。在聲音與物件之間，我追求同一件質感。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── 這裡保留你原本所有的 CSS 樣式 (省略以節省篇幅，請直接套用你原本的 style 內容) ── */
    :root { --white: #ffffff; --bg: #fafaf8; --border: #e8e8e4; --light: #f2f2ee; --mid: #c8c8c2; --muted: #8c8c86; --body: #3c3c38; --heading: #0f0f0e; --accent: #0f0f0e; --r: 14px; --r-sm: 8px; --max: 980px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--white); color: var(--body); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 36px; }
    section { padding: 96px 0; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.90); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 36px; height: 58px; display: flex; align-items: center; justify-content: space-between; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .nav-links a.active { color: var(--heading); }
    #hero { padding-top: 148px; padding-bottom: 80px; }
    .hero-grid { display: grid; grid-template-columns: 1fr 420px; gap: 72px; align-items: center; }
    .hero-headline { font-size: clamp(38px, 4.8vw, 58px); font-weight: 300; line-height: 1.12; color: var(--heading); }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .work-card { border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: var(--white); transition: all 0.3s cubic-bezier(.2,.8,.2,1); }
    .work-card.featured { grid-column: span 2; }
    .work-thumb { aspect-ratio: 4/3; background: var(--light); position: relative; overflow: hidden; }
    .work-card.featured .work-thumb { aspect-ratio: 16/7; }
    .work-category-badge { position: absolute; top: 12px; left: 12px; font-size: 9px; padding: 4px 10px; border-radius: 100px; }
    .badge-music { background: rgba(15,15,14,0.7); color: white; }
    .badge-design { background: rgba(255,255,255,0.85); color: black; }
    .reveal { opacity: 0; transform: translateY(20px); transition: 0.6s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    /* ... 其餘樣式請保持不變 ... */
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <span class="nav-logo">JH Studio</span>
      <ul class="nav-links" id="nav-menu">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#craft">Craft</a></li>
        <li><a href="#music">Music</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div class="hero-left">
          <div class="hero-eyebrow">JH Studio · Taiwan</div>
          <h1 class="hero-headline">Sound.<br>Objects.<br><em>Same obsession.</em></h1>
          <p class="hero-statement">音樂和設計對我來說是同一件事。<span>For me, sound and objects are the same pursuit.</span></p>
          <div class="hero-cta">
            <a href="#work" class="btn btn-dark">View Work</a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-photo"><div class="placeholder-img">Portrait</div></div>
        </div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <p class="sec-label">Selected Work</p>
      <h2 class="sec-title">近期作品</h2>
      <div class="sec-rule"></div>
      <div class="work-filter">
        <button class="filter-btn active" onclick="filterWork('all', this)">All</button>
        <button class="filter-btn" onclick="filterWork('music', this)">Music 音樂</button>
        <button class="filter-btn" onclick="filterWork('design', this)">Objects 設計</button>
      </div>

      <div class="work-grid" id="work-grid"></div>
    </div>
  </section>

  <script>
    // 1. 初始化 IntersectionObserver (負責捲動動畫)
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    // 2. 從 JSON 抓取資料並渲染
    let allProjects = [];

    async function loadProjects() {
      try {
        const response = await fetch('projects.json');
        allProjects = await response.json();
        renderProjects(allProjects);
      } catch (err) {
        console.error("無法載入作品資料:", err);
      }
    }

    function renderProjects(projects) {
      const container = document.getElementById('work-grid');
      container.innerHTML = ''; 

      projects.forEach(item => {
        const card = document.createElement('div');
        card.className = `work-card reveal ${item.featured ? 'featured' : ''}`;
        card.setAttribute('data-cat', item.category);
        
        card.innerHTML = `
          <div class="work-thumb">
            <img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
            <div class="placeholder-img" style="display:none">${item.image}</div>
            <span class="work-category-badge ${item.category === 'music' ? 'badge-music' : 'badge-design'}">
              ${item.category === 'music' ? 'Music' : 'Design'}
            </span>
          </div>
          <div class="work-info">
            <p class="work-date">${item.date}</p>
            <p class="work-name">${item.name}</p>
            <p class="work-role">${item.role}</p>
          </div>
        `;
        
        container.appendChild(card);
        observer.observe(card); // 讓新生成的卡片也有動畫
      });
    }

    // 3. 篩選功能
    function filterWork(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const filtered = cat === 'all' ? allProjects : allProjects.filter(p => p.category === cat);
      renderProjects(filtered);
    }

    // 啟動載入
    document.addEventListener('DOMContentLoaded', loadProjects);
  </script>
</body>
</html>
