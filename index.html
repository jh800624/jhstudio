<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — 黃友立 Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、設計師。在聲音與物件之間，追求同一件質感。" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  
  <style>
    /* ── 樣式變數 ── */
    :root {
      --white:   #ffffff;
      --bg:      #fafaf8;
      --border:  #e8e8e4;
      --muted:   #8c8c86;
      --body:    #3c3c38;
      --heading: #0f0f0e;
      --r:       14px;
      --max:     980px;
    }

    /* ── 基礎設定 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--white); color: var(--body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* ── 版面配置 ── */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 36px; }
    section { padding: 80px 0; }

    /* ── 導覽列 ── */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 36px; height: 58px; display: flex; align-items: center; justify-content: space-between; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 12px; color: var(--muted); text-transform: uppercase; transition: 0.2s; }
    .nav-links a:hover { color: var(--heading); }

    /* ── Hero 區塊 ── */
    #hero { padding-top: 140px; padding-bottom: 60px; }
    .hero-grid { display: grid; grid-template-columns: 1fr 400px; gap: 60px; align-items: center; }
    .hero-headline { font-size: clamp(36px, 5vw, 54px); font-weight: 300; line-height: 1.1; color: var(--heading); margin-bottom: 24px; }
    .hero-statement { font-size: 16px; border-left: 2px solid var(--border); padding-left: 20px; margin-bottom: 30px; }
    .btn { display: inline-flex; align-items: center; padding: 12px 24px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; border: none; background: var(--heading); color: #fff; }
    .hero-photo { aspect-ratio: 3/4; border-radius: var(--r); overflow: hidden; background: #f2f2ee; position: relative; }

    /* ── 作品集區塊 ── */
    .work-filter { display: flex; gap: 8px; margin-bottom: 30px; }
    .filter-btn { padding: 6px 16px; border-radius: 100px; font-size: 12px; border: 1px solid var(--border); cursor: pointer; background: #fff; }
    .filter-btn.active { background: var(--heading); color: #fff; }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .work-card { border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); transition: 0.3s; }
    .work-card.featured { grid-column: span 2; }
    .work-thumb { aspect-ratio: 4/3; position: relative; overflow: hidden; }
    .work-card.featured .work-thumb { aspect-ratio: 16/7; }
    .work-thumb img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
    .work-card:hover .work-thumb img { transform: scale(1.08); }
    .work-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 24px; opacity: 0; transition: 0.4s; backdrop-filter: blur(4px); }
    .work-card:hover .work-overlay { opacity: 1; }
    .work-info { padding: 16px; }

    /* ── Spotify 播放器容器 ── */
    .spotify-container { border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: #000; min-height: 152px; }

    /* ── 動畫 ── */
    .reveal { opacity: 0; transform: translateY(20px); transition: 0.6s ease; }
    .reveal.visible { opacity: 1; transform: none; }

    /* ── 手機版 ── */
    @media (max-width: 768px) {
      .hero-grid, .work-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .work-card.featured { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <span class="nav-logo">JH Studio</span>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#music">Music</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div class="hero-left">
          <h1 class="hero-headline">Sound.<br>Objects.<br><em>Same obsession.</em></h1>
          <p class="hero-statement">聲音和物件對我來說是同一件事。<span>For me, sound and objects are the same pursuit.</span></p>
          <a href="#work" class="btn">View Work</a>
        </div>
        <div class="hero-visual">
          <div class="hero-photo"><div style="display:flex; height:100%; align-items:center; justify-content:center; color:#888;">Portrait</div></div>
        </div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <h2 style="font-weight:300; margin-bottom:30px;">Selected Work</h2>
      <div class="work-filter">
        <button class="filter-btn active" onclick="filterWork('all', this)">All</button>
        <button class="filter-btn" onclick="filterWork('music', this)">Music</button>
        <button class="filter-btn" onclick="filterWork('design', this)">Design</button>
      </div>
      <div id="work-grid" class="work-grid"></div>
    </div>
  </section>

  <section id="music" style="background:var(--bg)">
    <div class="wrap">
      <p style="font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;">Listen</p>
      <h2 style="font-weight:300; margin-bottom:30px;">Portfolio · Spotify</h2>
      
      <div id="spotify-player" class="spotify-container reveal"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap" style="text-align:center;">
      <h2 style="font-weight:300; margin-bottom:20px;">Say hello.</h2>
      <p>合作洽詢：<a href="mailto:jh800624@gmail.com" style="border-bottom: 1px solid #000;">jh800624@gmail.com</a></p>
    </div>
  </section>

  <footer style="padding:40px 0; text-align:center; font-size:12px; color:var(--muted); border-top: 1px solid var(--border);">
    © 2025 JH Studio · Jerry Hang
  </footer>

  <script>
    /* ── 捲動動畫偵測 ── */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    let allWorks = [];

    /* ── 核心：從 JSON 載入所有資料 ── */
    async function loadData() {
      try {
        const response = await fetch('./projects.json?t=' + Date.now());
        if (!response.ok) throw new Error("找不到 projects.json");
        const data = await response.json();
        
        // 渲染作品集
        allWorks = data.works || [];
        renderWorks(allWorks);

        // 渲染 Spotify 播放器 (抓取陣列中的第一個 ID)
        if (data.spotify && data.spotify.length > 0) {
          renderSpotify(data.spotify[0]);
        }
      } catch (err) {
        console.error("載入出錯:", err);
      }
    }

    /* ── 渲染作品 HTML ── */
    function renderWorks(works) {
      const grid = document.getElementById('work-grid');
      grid.innerHTML = ''; 
      works.forEach(item => {
        const card = document.createElement('div');
        card.className = `work-card reveal ${item.featured ? 'featured' : ''}`;
        card.innerHTML = `
          <div class="work-thumb">
            <img src="${item.image}" alt="${item.name}">
            <div class="work-overlay"><strong>${item.name}</strong><p style="font-size:12px; margin-top:10px;">${item.note || ''}</p></div>
          </div>
          <div class="work-info">
            <p style="font-size:11px; color:#8c8c86;">${item.date}</p>
            <p style="font-size:14px; font-weight:500; margin-top:4px;">${item.name}</p>
          </div>
        `;
        grid.appendChild(card);
        observer.observe(card);
      });
    }

    /* ── 渲染 Spotify 播放器 ── */
    function renderSpotify(playlistId) {
      const container = document.getElementById('spotify-player');
      container.innerHTML = `
        <iframe 
          src="https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator" 
          width="100%" height="380" frameborder="0" allowfullscreen="" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
        </iframe>
      `;
      observer.observe(container);
    }

    /* ── 篩選功能 ── */
    function filterWork(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = (cat === 'all') ? allWorks : allWorks.filter(p => p.category === cat);
      renderWorks(filtered);
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
