<head>
  <meta charset="UTF-8" />

  <title>JH Studio — 黃友立 Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、發明家。在聲音與物件之間，我追求同一件事——質感。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Tokens ── */
    :root {
      --white:   #ffffff;
      --bg:      #fafaf8;
      --border:  #e8e8e4;
      --light:   #f2f2ee;
      --mid:     #c8c8c2;
      --muted:   #8c8c86;
      --body:    #3c3c38;
      --heading: #0f0f0e;
      --accent:  #0f0f0e;
      --r:       14px;
      --r-sm:    8px;
      --max:     980px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--white);
      color: var(--body);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* ── Layout ── */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 36px; }
    section { padding: 96px 0; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max); margin: 0 auto; padding: 0 36px;
      height: 58px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.04em; color: var(--heading);
    }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--heading); }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 4px; background: none; border: none;
    }
    .hamburger span { display: block; width: 20px; height: 1.5px; background: var(--heading); transition: 0.3s; }

    /* ── Hero ── */
    #hero { padding-top: 148px; padding-bottom: 80px; }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 72px; align-items: center;
    }
    .hero-eyebrow {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 24px;
    }
    .hero-eyebrow::before {
      content: ''; display: block;
      width: 28px; height: 1px; background: var(--mid);
    }
