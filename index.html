<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — 黃友立 Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、設計師。在聲音與物件之間，追求同一件質感。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── 變數與基礎設定 ── */
    :root {
      --white: #ffffff; --bg: #fafaf8; --border: #e8e8e4; --muted: #8c8c86;
      --body: #3c3c38; --heading: #0f0f0e; --accent: #0f0f0e;
      --r: 16px; --max: 1200px; --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--white); color: var(--body); -webkit-font-smoothing: antialiased; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 48px; }
    section { padding: 120px 0; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* ── 導覽列 ── */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 48px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; transition: 0.3s; }
    .nav-links a:hover { color: var(--heading); }

    /* ── Hero 區塊 ── */
    #hero { padding-top: 180px; padding-bottom: 100px; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center; }
    .hero-eyebrow { display: flex; align-items: center; gap: 12px; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
    .hero-eyebrow::before { content: ''; display: block; width: 32px; height: 1px; background: var(--muted); }
    .hero-headline { font-size: clamp(44px, 7vw, 72px); font-weight: 300; line-height: 1; color: var(--heading); margin-bottom: 32px; letter-spacing: -0.04em; }
    .hero-headline em { font-style: italic; color: var(--muted); font-weight: 300; }
    .hero-statement { font-size: 18px; line-height: 1.8; color: var(--body); max-width: 580px; margin-bottom: 48px; border-left: 2px solid var(--border); padding-left: 24px; }
    .hero-statement span { display: block; font-size: 14px; color: var(--muted); margin-top: 10px; font-style: italic; font-family: 'Inter', sans-serif; }
    .hero-photo { aspect-ratio: 4/5; border-radius: var(--r); overflow: hidden; background: #f2f2ee; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.06); }
    .hero-photo-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 32px; background: linear-gradient(to top, rgba(15,15,14,0.7), transparent); display: flex; flex-wrap: wrap; gap: 8px; }
    .role-tag { font-size: 10px; color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.12); padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; }

    /* ── About 區塊 ── */
    #about { background: var(--bg); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
    .fact-card { padding: 32px; background: var(--white); border-radius: var(--r); border: 1px solid var(--border); margin-bottom: 24px; }
    .fact-num { font-size: 42px; font-weight: 300; color: var(--heading); line-height: 1; }

    /* ── Work 區塊 ── */
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .work-card { border-radius: var(--r); overflow: hidden; background: var(--white); border: 1px solid var(--border); transition: 0.5s var(--ease); }
    .work-card:hover { transform: translateY(-10px); box-shadow: 0 32px 70px rgba(0,0,0,0.1); }
    .work-card.featured { grid-column: span 2; }
    .work-thumb { aspect-ratio: 4/3; position: relative; overflow: hidden; }
    .work-card.featured .work-thumb { aspect-ratio: 16/8; }
    .work-thumb::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); opacity: 0; transition: 0.5s; }
    .work-card:hover .work-thumb::after { opacity: 1; }
    .work-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 32px; color: #fff; z-index: 2; opacity: 0; transform: translateY(20px); transition: 0.5s var(--ease); }
    .work-card:hover .work-overlay { opacity: 1; transform: translateY(0); }

    /* ── 響應式 ── */
    @media (max-width: 768px) {
      .hero-grid, .about-grid, .work-grid { grid-template-columns: 1fr; gap: 40px; }
      .nav-links { display: none; }
      .wrap { padding: 0 24px; }
      .work-card.featured { grid-column: span 1; }
    }
    .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s var(--ease); }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <nav><div class="nav-inner"><span class="nav-logo">JH Studio</span><ul class="nav-links"><li><a href="#about">About</a></li><li><a href="#work">Work</a></li><li><a href="#music">Music</a></li></ul></div></nav>

  <section id="hero"><div class="wrap"><div class="hero-grid" id="hero-content"></div></div></section>

  <section id="about"><div class="wrap"><div class="about-grid" id="about-content"></div></div></section>

  <section id="work">
    <div class="wrap">
      <h2 style="font-size:42px; font-weight:300; margin-bottom:60px;">Portfolio</h2>
      <div id="work-grid" class="work-grid"></div>
    </div>
  </section>

  <section id="music"><div class="wrap"><div id="spotify-player" style="border-radius:16px; overflow:hidden;"></div></div></section>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    async function init() {
      try {
        const response = await fetch('./projects.json?t=' + Date.now());
        const data = await response.json();

        // 1. 注入 Hero 內容
        const hero = data.hero;
        document.getElementById('hero-content').innerHTML = `
          <div class="hero-left reveal">
            <div class="hero-eyebrow">${hero.eyebrow}</div>
            <h1 class="hero-headline">${hero.headline}</h1>
            <p class="hero-statement">${hero.statement}<span>${hero.statement_en}</span></p>
          </div>
          <div class="hero-visual reveal">
            <div class="hero-photo">
              <img src="${hero.photo}" alt="Portrait">
              <div class="hero-photo-caption">${hero.roles.map(r => `<span class="role-tag">${r}</span>`).join('')}</div>
            </div>
          </div>
        `;

        // 2. 注入 About 內容
        const about = data.about;
        document.getElementById('about-content').innerHTML = `
          <div class="about-text reveal">
            <h2 style="font-size:42px; font-weight:300; margin-bottom:40px;">${about.title}</h2>
            <p>${about.p1}</p><p>${about.p2}</p>
          </div>
          <div class="about-facts reveal">
            ${about.facts.map(f => `<div class="fact-card"><div class="fact-num">${f.num}</div><div class="fact-label">${f.label}</div></div>`).join('')}
          </div>
        `;

        // 3. 注入作品集與 Spotify
        renderWorks(data.works);
        if (data.spotify) renderSpotify(data.spotify[0]);

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
      } catch (err) { console.error(err); }
    }

    function renderWorks(works) {
      const grid = document.getElementById('work-grid');
      works.forEach(item => {
        const card = document.createElement('div');
        card.className = `work-card reveal ${item.featured ? 'featured' : ''}`;
        card.innerHTML = `<div class="work-thumb"><img src="${item.image}"><div class="work-overlay"><strong>${item.name}</strong><p style="font-size:13px; margin-top:12px;">${item.note || ''}</p></div></div><div class="work-info"><p style="font-size:11px; color:#8c8c86;">${item.date}</p><p style="font-size:15px; font-weight:500; margin-top:8px;">${item.name}</p></div>`;
        grid.appendChild(card);
        observer.observe(card);
      });
    }

    function renderSpotify(id) {
      document.getElementById('spotify-player').innerHTML = `<iframe src="https://open.spotify.com/embed/playlist/${id}?utm_source=generator&theme=0" width="100%" height="380" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
    }

    init();
  </script>
</body>
</html>
