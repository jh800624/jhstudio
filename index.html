<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — 黃友立 Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、設計師。在聲音與物件之間，追求同一件質感。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Tokens ── */
    :root {
      --white: #ffffff;
      --bg: #fafaf8;
      --border: #eeeeee;
      --muted: #888888;
      --body: #333333;
      --heading: #000000;
      --max: 1200px;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--white);
      color: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* ── Layout ── */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 48px; }
    section { padding: 100px 0; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max); margin: 0 auto; padding: 0 48px;
      height: 72px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s; }
    .nav-links a:hover { color: var(--heading); }

    /* ── ✨ Hero (依照截圖排版修正) ✨ ── */
    #hero { padding-top: 180px; padding-bottom: 120px; }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 左右對等分欄 */
      gap: 60px;
      align-items: flex-start;
    }

    /* 左側內容區 */
    .hero-left { padding-top: 20px; }
    .hero-eyebrow {
      font-size: 11px; text-transform: uppercase; color: var(--muted);
      letter-spacing: 0.2em; margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .hero-eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--muted); }
    
    .hero-headline {
      font-size: clamp(48px, 6vw, 76px);
      font-weight: 300; line-height: 1;
      color: var(--heading); margin-bottom: 40px;
      letter-spacing: -0.04em;
    }
    .hero-headline em { font-style: italic; color: var(--muted); font-weight: 300; }

    .hero-statement {
      font-size: 18px; line-height: 1.8;
      border-left: 2px solid var(--border);
      padding-left: 24px; margin-bottom: 48px;
      color: var(--body); font-weight: 300;
    }
    .hero-statement span {
      display: block; font-size: 14px; color: var(--muted);
      font-style: italic; margin-top: 16px; line-height: 1.6;
    }

    /* 按鈕與標籤 */
    .spotify-tag {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 20px; background: #f2f2ee; border-radius: 100px;
      font-size: 12px; font-weight: 500; color: var(--body);
      margin-bottom: 32px; transition: 0.3s;
    }
    .spotify-tag:hover { background: var(--border); }
    .spotify-dot {
      width: 8px; height: 8px; background: #1DB954; border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(29,185,84,0.15);
    }

    .hero-cta { display: flex; gap: 16px; }
    .btn {
      padding: 16px 36px; border-radius: 12px; font-size: 14px;
      font-weight: 500; cursor: pointer; transition: 0.3s var(--ease);
      border: none; text-decoration: none;
    }
    .btn-dark { background: #0f0f0e; color: #fff; }
    .btn-dark:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
    .btn-gray { background: #f2f2ee; color: #0f0f0e; }
    .btn-gray:hover { background: #e8e8e4; }

    /* 右側大圖區 */
    .hero-visual { position: relative; }
    .hero-photo {
      aspect-ratio: 4/5; border-radius: 20px;
      overflow: hidden; background: #f5f5f5;
      box-shadow: 0 40px 100px rgba(0,0,0,0.05);
    }
    .hero-photo-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 40px;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .role-tag {
      font-size: 10px; color: #fff; text-transform: uppercase;
      background: rgba(255,255,255,0.15); padding: 6px 14px;
      border-radius: 100px; border: 1px solid rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    /* ── Work ── */
    #work { border-top: 1px solid var(--border); }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .work-card { border-radius: 16px; overflow: hidden; border: 1px solid var(--border); transition: 0.5s var(--ease); }
    .work-card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px rgba(0,0,0,0.05); }

    /* ── ✨ Contact Section (依照截圖還原) ✨ ── */
    #contact { border-top: 1px solid var(--border); }
    .contact-card-list { display: flex; flex-direction: column; gap: 16px; max-width: 500px; }
    .contact-card {
      display: flex; align-items: center; gap: 20px;
      padding: 24px 32px; border-radius: 16px;
      border: 1px solid var(--border); background: #fafafa;
      transition: 0.3s var(--ease);
    }
    .contact-card:hover { background: var(--white); transform: translateX(8px); border-color: var(--muted); }
    .contact-icon {
      width: 48px; height: 48px; border-radius: 50%; background: #fff;
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    }

    /* ── Footer ── */
    footer { padding: 60px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; }

    @media (max-width: 900px) {
      .hero-grid { grid-columns: 1fr; }
      .nav-links { display: none; }
      .wrap { padding: 0 24px; }
    }

    .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s var(--ease); }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <span class="nav-logo" style="font-weight: 500;">JH Studio</span>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#music">Music</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero">
    <div class="wrap">
      <div class="hero-grid" id="hero-content">
        </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <p style="font-size:11px; color:var(--muted); letter-spacing:0.2em; margin-bottom:16px;">PORTFOLIO</p>
      <h2 style="font-size:36px; font-weight:300; margin-bottom:48px;">Selected Work</h2>
      <div id="work-grid" class="work-grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <p style="font-size:11px; color:var(--muted); letter-spacing:0.2em; margin-bottom:16px;">SAY HELLO</p>
      <h2 style="font-size:42px; font-weight:300; margin-bottom:40px;">有任何合作<br>都歡迎聯絡。</h2>
      <div class="contact-card-list">
        <a href="https://www.instagram.com/jerryhang_" target="_blank" class="contact-card reveal">
          <div class="contact-icon">📸</div>
          <div>
            <p style="font-size:10px; color:var(--muted);">INSTAGRAM</p>
            <p style="font-weight:500;">@jerryhang_</p>
          </div>
        </a>
        <a href="mailto:jh800624@gmail.com" class="contact-card reveal">
          <div class="contact-icon">✉️</div>
          <div>
            <p style="font-size:10px; color:var(--muted);">EMAIL</p>
            <p style="font-weight:500;">jh800624@gmail.com</p>
          </div>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div class="footer-inner">
        <div>JH Studio · 黃友立 Jerry Hang</div>
        <div style="display:flex; gap:20px;"><a href="#">Instagram</a><a href="#">Email</a></div>
        <div style="color:#bbb;">© 2025 JH Studio</div>
      </div>
    </div>
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    async function init() {
      try {
        const response = await fetch('./projects.json?t=' + Date.now());
        const data = await response.json();

        // ✨ 注入 Hero (依照截圖還原排版)
        document.getElementById('hero-content').innerHTML = `
          <div class="hero-left reveal">
            <div class="hero-eyebrow">${data.hero.eyebrow}</div>
            <h1 class="hero-headline">${data.hero.headline}</h1>
            <p class="hero-statement">${data.hero.statement}<span>${data.hero.statement_en}</span></p>
            
            <a href="#music" class="spotify-tag">
              <span class="spotify-dot"></span>Listen to my work on Spotify
            </a>

            <div class="hero-cta">
              <a href="#work" class="btn btn-dark">View Work</a>
              <a href="#contact" class="btn btn-gray">Get in Touch</a>
            </div>
          </div>
          <div class="hero-visual reveal">
            <div class="hero-photo">
              <img src="${data.hero.photo}" alt="Portrait">
              <div class="hero-photo-caption">
                ${data.hero.roles.map(r => `<span class="role-tag">${r}</span>`).join('')}
              </div>
            </div>
          </div>
        `;

        // 注入作品集
        const grid = document.getElementById('work-grid');
        data.works.forEach(item => {
          const card = document.createElement('div');
          card.className = `work-card reveal ${item.featured ? 'featured' : ''}`;
          card.innerHTML = `<div style="aspect-ratio:4/3; overflow:hidden;"><img src="${item.image}"></div><div style="padding:24px;"><p style="font-size:11px; color:#888;">${item.date}</p><p style="font-size:15px; font-weight:500; margin-top:8px;">${item.name}</p></div>`;
          grid.appendChild(card);
          observer.observe(card);
        });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
      } catch (err) { console.error(err); }
    }
    init();
  </script>
</body>
</html>
