<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、設計師。在聲音與物件之間，追求同一個感受。" />

  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Tokens ── */
    :root {
      --white:   #ffffff;
      --bg:      #f8f8f8;
      --border:  #eeeeee;
      --light:   #f2f2f2;
      --mid:     #cccccc;
      --muted:   #888888;
      --body:    #444444;
      --heading: #000000;
      --r:       14px;
      --max:     1200px;
      --ease:    cubic-bezier(0.23, 1, 0.32, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--white); color: var(--body);
      font-size: 16px; line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Layout ── */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 48px; }
    section { padding: 96px 0; }

    /* ── Page Loader ── */
    #page-loader {
      position: fixed; inset: 0; background: var(--white);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s;
    }
    #page-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mid); margin: 0 4px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; } 40% { transform: scale(1.2); opacity: 1; } }

    /* ── Nav ── */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 48px; height: 58px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--heading); }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 12px; font-weight: 400; text-transform: uppercase; color: var(--muted); transition: 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--heading); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; }
    .hamburger span { display: block; width: 20px; height: 1.5px; background: var(--heading); transition: 0.3s; }

    /* ── Hero ── */
    #hero { padding-top: 148px; padding-bottom: 80px; }
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; }
    .hero-eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
    .hero-eyebrow::before { content: ''; display: block; width: 28px; height: 1px; background: var(--mid); }
    .hero-headline { font-size: clamp(38px, 4.8vw, 58px); font-weight: 300; line-height: 1.12; color: var(--heading); margin-bottom: 28px; }
    .hero-headline em { font-style: italic; color: var(--muted); font-weight: 300; }
    .hero-statement { font-size: 16px; line-height: 1.85; border-left: 2px solid var(--border); padding-left: 20px; margin-bottom: 36px; }
    .hero-statement span { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; font-style: italic; line-height: 1.6; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px; border-radius: 12px; font-size: 13px; font-weight: 500; transition: 0.2s; border: none; cursor: pointer; }
    .btn-dark { background: #000; color: #fff; }
    .btn-gray { background: #eee; color: #000; }

    /* ── Carousel ── */
    .hero-photo { aspect-ratio: 4/5; border-radius: var(--r); overflow: hidden; background: var(--light); position: relative; }
    .carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
    .carousel-slide.active { opacity: 1; }
    .carousel-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .carousel-slide.active img { animation: zoomOut 6s ease-out forwards; }
    @keyframes zoomOut { from { transform: scale(1.08); } to { transform: scale(1.0); } }

    /* ── Work ── */
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 360px; gap: 16px; }
    .work-card { border-radius: var(--r); overflow: hidden; position: relative; background: var(--light); transition: transform 0.4s var(--ease), box-shadow 0.4s; }
    .work-card:hover { transform: translateY(-10px); box-shadow: 0 24px 64px rgba(0,0,0,0.15); }
    .work-card.featured { grid-column: span 2; grid-row: span 2; }
    .work-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease), filter 0.5s; }
    .work-card:hover img { transform: scale(1.06); filter: blur(2px) brightness(0.75); }
    .work-overlay { position: absolute; inset: 0; z-index: 5; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%); opacity: 0; transition: opacity 0.4s; display: flex; flex-direction: column; justify-content: flex-end; padding: 28px; }
    .work-card:hover .work-overlay { opacity: 1; }
    .work-overlay-inner { transform: translateY(16px); transition: transform 0.4s var(--ease); }
    .work-card:hover .work-overlay-inner { transform: translateY(0); }

    /* ── Music ── */
    .music-platform-tabs { display: flex; gap: 8px; margin-bottom: 28px; }
    .platform-tab { padding: 8px 18px; border-radius: 100px; font-size: 12px; border: 1px solid var(--border); background: var(--white); cursor: pointer; transition: 0.2s; }
    .platform-tab.active { background: var(--heading); color: var(--white); }
    .music-embed { display: none; border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
    .music-embed.active { display: block; }

    /* ── Clients & Footer ── */
    .client-pill { padding: 9px 18px; border-radius: 100px; background: var(--white); border: 1px solid var(--border); font-size: 13px; margin: 4px; display: inline-block; }
    footer { padding: 48px 0; border-top: 1px solid var(--border); background: var(--white); }
    .footer-inner { display: flex; justify-content: space-between; font-size: 13px; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .hero-grid, .work-grid, .about-grid { grid-template-columns: 1fr; }
      .work-grid { grid-auto-rows: 300px; }
      .work-card.featured { grid-column: span 1; grid-row: span 1; }
      .nav-links { display: none; }
      .wrap { padding: 0 24px; }
    }

    .reveal { opacity: 0; transform: translateY(20px); transition: 0.6s ease; }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <div id="page-loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>

  <nav>
    <div class="nav-inner">
      <span class="nav-logo">JH Studio</span>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#craft">Craft</a></li>
        <li><a href="#music">Music</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero"><div class="wrap"><div class="hero-grid" id="hero-content"><div id="hero-left"></div><div id="hero-visual"></div></div></div></section>
  <section id="about" style="background:var(--bg)"><div class="wrap" id="about-grid" class="about-grid"></div></section>
  
  <section id="work">
    <div class="wrap">
      <h2 style="font-weight:300; margin-bottom:40px;">Selected Work</h2>
      <div id="work-grid" class="work-grid"></div>
    </div>
  </section>

  <section id="craft"><div class="wrap"><h2>Craft</h2><div id="craft-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:40px;"></div></div></section>

  <section id="music">
    <div class="wrap">
      <h2 style="font-weight:300; margin-bottom:32px;">Listen</h2>
      <div class="music-platform-tabs" id="music-tabs"></div>
      <div id="music-embeds"></div>
    </div>
  </section>

  <section id="clients"><div class="wrap" id="clients-cloud"></div></section>

  <section id="contact" style="background:var(--bg)">
    <div class="wrap" id="contact-grid" class="contact-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:60px;"></div>
  </section>

  <footer><div class="wrap"><div class="footer-inner" id="footer-inner"></div></div></footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    function switchPlatform(platform, btn) {
      document.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.music-embed').forEach(e => e.classList.remove('active'));
      document.getElementById('embed-' + platform).classList.add('active');
    }

    async function init() {
      try {
        const res = await fetch('projects.json?t=' + Date.now());
        const data = await res.json();

        // Hero
        const h = data.hero;
        document.getElementById('hero-left').innerHTML = `
          <div class="hero-eyebrow">${h.eyebrow}</div>
          <h1 class="hero-headline">${h.headline.join('<br>')}</h1>
          <p class="hero-statement">${h.statement_zh}<span>${h.statement_en}</span></p>
          <div style="margin-top:40px; display:flex; gap:12px;">
            <a href="#work" class="btn btn-dark">View Work</a>
            <a href="#contact" class="btn btn-gray">Get in Touch</a>
          </div>`;
        document.getElementById('hero-visual').innerHTML = `
          <div class="hero-photo">${h.photos.map((src, i) => `<div class="carousel-slide ${i === 0 ? 'active' : ''}"><img src="${src}"></div>`).join('')}</div>`;
        
        // Works
        document.getElementById('work-grid').innerHTML = data.works.map(w => `
          <div class="work-card ${w.featured ? 'featured' : ''} reveal">
            <img src="${w.image}">
            <div class="work-overlay"><div class="work-overlay-inner"><p style="font-size:12px; opacity:0.6;">${w.date}</p><strong>${w.name}</strong><p style="font-size:13px; margin-top:8px;">${w.note || ''}</p></div></div>
          </div>`).join('');

        // Music
        document.getElementById('music-tabs').innerHTML = `
          <button class="platform-tab active" onclick="switchPlatform('spotify', this)">Spotify</button>
          <button class="platform-tab" onclick="switchPlatform('youtube', this)">YouTube</button>`;
        document.getElementById('music-embeds').innerHTML = `
          <div class="music-embed active" id="embed-spotify"><iframe src="https://open.spotify.com/embed/playlist/${data.music.spotify_playlist_id}" width="100%" height="400" frameborder="0"></iframe></div>
          <div class="music-embed" id="embed-youtube"><iframe src="https://www.youtube.com/embed/videoseries?list=${data.music.youtube_playlist_id}" width="100%" height="400" frameborder="0"></iframe></div>`;

        // Footer
        document.getElementById('footer-inner').innerHTML = `<div>JH Studio · Jerry Hang</div><div style="color:#bbb;">© 2025 JH Studio</div>`;

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        document.getElementById('page-loader').classList.add('hidden');
      } catch (err) { console.error(err); }
    }

    init();
  </script>
</body>
</html>
