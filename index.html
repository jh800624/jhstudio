<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Studio — Jerry Hang</title>
  <meta name="description" content="JH Studio · 音樂人、設計師。在聲音與物件之間，追求同一個感受。" />

  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── 色彩與尺寸變數 ──
       要改顏色主題，修改這裡就好，全站會跟著變
       --white / --bg：背景色（白色 / 淺灰）
       --border / --light / --mid：邊框與區塊背景
       --muted / --body / --heading：文字深淺
       --r / --r-sm：圓角大小
       --max：內容最大寬度 */
    :root {
      --white:   #ffffff;
      --bg:      #f8f8f8;
      --border:  #eeeeee;
      --light:   #f2f2f2;
      --mid:     #cccccc;
      --muted:   #888888;
      --body:    #444444;
      --heading: #000000;
      --r:       14px;
      --r-sm:    12px;
      --max:     1200px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--white); color: var(--body);
      font-size: 16px; line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── 版面 ──
       .wrap：限制最大寬度、左右內距 48px
       section：每個區塊上下統一 96px 留白（手機版改為 64px） */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 48px; }
    section { padding: 96px 0; }

    /* ── 載入動畫 ── */
    #page-loader {
      position: fixed; inset: 0; background: var(--white);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s;
    }
    #page-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--mid); margin: 0 4px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* ── 導覽列 ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max); margin: 0 auto; padding: 0 48px;
      height: 58px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--heading); }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 12px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--heading); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 20px; height: 1.5px; background: var(--heading); transition: 0.3s; }

    /* ── Hero 首頁區塊 ── */
    #hero { padding-top: 148px; padding-bottom: 80px; }
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; }
    .hero-eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
    .hero-eyebrow::before { content: ''; display: block; width: 28px; height: 1px; background: var(--mid); }
    .hero-headline { font-size: clamp(38px, 4.8vw, 58px); font-weight: 300; line-height: 1.12; letter-spacing: -0.025em; color: var(--heading); margin-bottom: 28px; }
    .hero-headline em { font-style: italic; font-weight: 300; color: var(--muted); }
    .hero-statement { font-size: 16px; line-height: 1.85; color: var(--body); max-width: 480px; border-left: 2px solid var(--border); padding-left: 20px; margin-bottom: 36px; font-family: 'Noto Sans TC', sans-serif; }
    .hero-statement span { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; font-family: 'Inter', sans-serif; font-style: italic; line-height: 1.6; }
    .hero-listen { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px 10px 14px; background: var(--light); border-radius: 100px; font-size: 12px; font-weight: 500; color: var(--body); letter-spacing: 0.03em; transition: background 0.2s; margin-bottom: 32px; }
    .hero-listen:hover { background: var(--border); }
    .hero-listen-dot { width: 8px; height: 8px; border-radius: 50%; background: #1DB954; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(29,185,84,0.2); }
    .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; transition: all 0.2s; border: none; cursor: pointer; }
    .btn-dark { background: #000000; color: #ffffff; }
    .btn-dark:hover { background: #222222; }
    .btn-gray { background: #eeeeee; color: #000000; }
    .btn-gray:hover { background: #dddddd; }

    /* ── Hero 右側照片輪播 ──
       carousel-slide：每張照片的容器，用 opacity 做淡入淡出
       .active：目前顯示的那張（zoom out 動畫）
       .leaving：正在離場的那張（zoom in 動畫）*/
    .hero-visual { position: relative; }
    .hero-photo { aspect-ratio: 4/5; border-radius: var(--r); overflow: hidden; background: var(--light); position: relative; }
    @keyframes zoomOut {
      from { transform: scale(1.08); }
      to   { transform: scale(1.0);  }
    }
    @keyframes zoomIn {
      from { transform: scale(1.0);  }
      to   { transform: scale(1.08); }
    }
    .carousel-slide {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    .carousel-slide.active  { opacity: 1; }
    .carousel-slide.leaving { opacity: 0; }
    .carousel-slide img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      transform: scale(1.08);
    }
    /* 進場：從大縮小 (zoom out) */
    .carousel-slide.active img {
      animation: zoomOut 6s ease-out forwards;
    }
    /* 離場：繼續放大 (zoom in) */
    .carousel-slide.leaving img {
      animation: zoomIn 1.6s ease-in forwards;
    }
    .carousel-slide .placeholder-img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-photo-caption { position: absolute; bottom: -1px; left: 0; right: 0; padding: 48px 24px 24px; background: linear-gradient(to top, rgba(0,0,0,0.65), transparent); border-radius: 0 0 var(--r) var(--r); z-index: 10; }
    .hero-roles { display: flex; flex-wrap: wrap; gap: 6px; }
    .hero-role-tag { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.8); font-weight: 400; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.2); }
    .placeholder-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--light); color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-align: center; padding: 16px; }

    /* ── 區塊標題樣式 ──
       .sec-label：小標（英文全大寫，灰色）
       .sec-title：大標題
       .sec-rule：標題下方的短橫線 */
    .sec-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .sec-title { font-size: clamp(26px, 3vw, 34px); font-weight: 300; color: var(--heading); letter-spacing: -0.02em; line-height: 1.2; }
    .sec-rule { width: 32px; height: 1px; background: var(--heading); margin: 18px 0 52px; }

    /* ── About 自我介紹區塊 ── */
    #about { background: var(--bg); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
    .about-text p { font-size: 15px; line-height: 1.9; color: var(--body); margin-bottom: 16px; }
    .about-text p:last-child { margin-bottom: 0; }
    .about-text strong { color: var(--heading); font-weight: 500; }
    .about-facts { display: flex; flex-direction: column; gap: 24px; padding-top: 8px; }
    .about-fact { padding: 20px 24px; background: var(--white); border: 1px solid var(--border); border-radius: var(--r-sm); }
    .about-fact-num { font-size: 28px; font-weight: 300; color: var(--heading); letter-spacing: -0.03em; line-height: 1; margin-bottom: 4px; }
    .about-fact-label { font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }

    /* ── 近期作品區塊 ── */
    #work {}
    /* 篩選按鈕列（All / Music / Design） */
    .work-filter { display: flex; gap: 8px; margin-bottom: 40px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 16px; border-radius: 100px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; border: 1px solid var(--border); background: var(--white); color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--heading); color: var(--white); border-color: var(--heading); }

    /* 作品卡片 Grid 排版
       3 欄，固定列高 360px，所有卡片等高
       要調整卡片高度，改 grid-auto-rows 的值 */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 360px;
      gap: 16px;
    }

    .work-card {
      border-radius: var(--r);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: var(--light);
      /* 不設 aspect-ratio，讓 grid-auto-rows 控制高度 */
      transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s;
    }
    .work-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.15);
    }

    /* featured 卡片：跨 2 欄 × 2 列，視覺上比其他卡大一倍 */
    .work-card.featured {
      grid-column: span 2;
      grid-row: span 2;
    }

    /* 圖片全滿卡片，absolute 定位自動裁切填滿
       object-position: center 是預設置中裁切
       若某張圖想改裁切位置，可對該 <img> 加 style="object-position: top" 等 */
    .work-card img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1), filter 0.5s;
    }
    .work-card:hover img {
      transform: scale(1.06);
      filter: blur(2px) brightness(0.75);
    }

    /* Placeholder when no image */
    .work-card .placeholder-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transition: filter 0.5s;
    }
    .work-card:hover .placeholder-img {
      filter: brightness(0.6);
    }

    /* 類別標籤（左上角），hover 時隱藏，讓 overlay 文字接手 */
    .work-category-badge {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 4px 12px;
      border-radius: 100px; backdrop-filter: blur(8px);
      transition: opacity 0.3s;
    }
    .work-card:hover .work-category-badge { opacity: 0; }
    .badge-music  { background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9); }
    .badge-design { background: rgba(255,255,255,0.8); color: var(--heading); }

    /* Overlay：平時隱藏，hover 時顯示，從底部漸層黑色蓋上去 */
    .work-overlay {
      position: absolute; inset: 0; z-index: 5;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.82) 0%,
        rgba(0,0,0,0.4)  45%,
        transparent      100%
      );
      opacity: 0;
      transition: opacity 0.4s;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 28px 28px 28px;
    }
    .work-card:hover .work-overlay { opacity: 1; }

    /* Overlay 文字：hover 時從略低的位置往上滑入 */
    .work-overlay-inner {
      transform: translateY(16px);
      transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    }
    .work-card:hover .work-overlay-inner { transform: translateY(0); }

    .work-overlay-badge {
      display: inline-block;
      font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.55);
      margin-bottom: 8px;
    }
    .work-overlay-name {
      font-size: 15px; font-weight: 500;
      color: #ffffff; line-height: 1.4;
      margin-bottom: 6px;
      font-family: 'Noto Sans TC', sans-serif;
    }
    .work-overlay-role {
      font-size: 11px; color: rgba(255,255,255,0.6);
      letter-spacing: 0.04em;
    }
    .work-overlay-date {
      font-size: 10px; color: rgba(255,255,255,0.4);
      letter-spacing: 0.06em; margin-top: 10px;
      text-transform: uppercase;
    }

    /* ── 服務項目區塊 ── */
    #craft { background: var(--bg); }
    .craft-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .craft-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 32px 36px; }
    .craft-icon { font-size: 22px; margin-bottom: 18px; }
    .craft-name-zh { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .craft-name-en { font-size: 19px; font-weight: 500; color: var(--heading); letter-spacing: -0.015em; margin-bottom: 16px; }
    .craft-desc-zh { font-size: 14px; color: var(--body); line-height: 1.8; margin-bottom: 10px; font-family: 'Noto Sans TC', sans-serif; }
    .craft-desc-en { font-size: 13px; color: var(--muted); line-height: 1.7; }

    /* ── 音樂平台區塊 ── */
    .music-platform-tabs { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
    .platform-tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 18px; border-radius: 100px; font-size: 12px; font-weight: 500; letter-spacing: 0.03em; border: 1px solid var(--border); background: var(--white); color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .platform-tab:hover { border-color: var(--heading); color: var(--heading); }
    .platform-tab.active { background: var(--heading); color: var(--white); border-color: var(--heading); }
    .platform-tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-spotify    { background: #1DB954; }
    .dot-youtube    { background: #FF0000; }
    .dot-soundcloud { background: #FF5500; }
    .music-embed-wrap { border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
    .music-embed { display: none; }
    .music-embed.active { display: block; }
    .music-embed iframe { display: block; }
    .soundcloud-card { padding: 40px; text-align: center; background: var(--light); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .soundcloud-card p { font-size: 13px; color: var(--muted); }

    /* ── 合作夥伴 ── */
    /* padding-top:0 是因為上方 Music 區塊已有 96px padding，這裡不再重複 */
    #clients { background: var(--bg); padding-top: 0; padding-bottom: 40px; }
    /* 兩側漸層遮罩，製造淡入淡出效果
       要調整淡出範圍，改 80px 的數值 */
    .clients-cloud { overflow: hidden; mask-image: linear-gradient(to right, transparent, black 80px, black calc(100% - 80px), transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 80px, black calc(100% - 80px), transparent); }
    .marquee-track { display: flex; gap: 10px; width: max-content; animation: marquee-scroll 48s linear infinite; }
    @keyframes marquee-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .client-pill { padding: 9px 18px; border-radius: 100px; background: var(--white); border: 1px solid var(--border); font-size: 13px; color: var(--body); letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0; }

    /* ── Modal 彈出視窗 ── */
    /* display:flex 固定，用 opacity + visibility 做淡入淡出，才能有過渡效果 */
    #modal-overlay { display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 400; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease, visibility 0.3s ease; }
    #modal-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    /* 卡片本身也有縮放 + 位移的過渡，進場從略小略低浮上來 */
    #modal-card { background: var(--white); border-radius: var(--r); max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; opacity: 0; transform: scale(0.96) translateY(10px); transition: opacity 0.3s cubic-bezier(.2,.8,.2,1), transform 0.3s cubic-bezier(.2,.8,.2,1); }
    #modal-overlay.open #modal-card { opacity: 1; transform: none; }
    .modal-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.35); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; line-height: 1; transition: background 0.2s; z-index: 10; }
    .modal-close:hover { background: rgba(0,0,0,0.6); }
    .modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: center; border-radius: var(--r) var(--r) 0 0; display: block; }
    .modal-img-placeholder { width: 100%; aspect-ratio: 16/9; background: var(--light); border-radius: var(--r) var(--r) 0 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
    .modal-content { padding: 24px 28px 28px; }
    .modal-badge { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .modal-title { font-size: 20px; font-weight: 500; color: var(--heading); line-height: 1.35; margin-bottom: 6px; font-family: 'Noto Sans TC', sans-serif; }
    .modal-meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .modal-desc-zh { font-size: 14px; color: var(--body); line-height: 1.85; margin-bottom: 10px; font-family: 'Noto Sans TC', sans-serif; }
    .modal-desc-en { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .modal-craft-icon { font-size: 32px; margin-bottom: 16px; }
    .modal-craft-sub { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .modal-craft-title { font-size: 22px; font-weight: 500; color: var(--heading); letter-spacing: -0.015em; margin-bottom: 20px; }
    @media (max-width: 768px) { #modal-card { max-width: 100%; } }

    /* ── 聯絡區塊 ── */
    #contact { background: var(--bg); }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }
    .contact-headline { font-size: clamp(28px, 3.5vw, 40px); font-weight: 300; color: var(--heading); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 20px; }
    .contact-sub { font-size: 15px; color: var(--muted); line-height: 1.8; max-width: 360px; margin-bottom: 40px; font-family: 'Noto Sans TC', sans-serif; }
    .contact-items { display: flex; flex-direction: column; gap: 12px; }
    .contact-item { display: flex; align-items: center; gap: 16px; padding: 18px 22px; background: var(--white); border: 1px solid var(--border); border-radius: var(--r-sm); transition: box-shadow 0.2s; }
    .contact-item:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
    .contact-item-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--light); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .contact-item-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .contact-item-val { font-size: 14px; font-weight: 500; color: var(--heading); }
    .contact-right { padding-top: 16px; }
    .contact-note { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 28px 32px; font-size: 14px; color: var(--muted); line-height: 1.85; font-family: 'Noto Sans TC', sans-serif; }
    .contact-note strong { display: block; font-size: 12px; font-weight: 600; color: var(--heading); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 12px; }

    /* ── Footer ──
       版權文字 / 連結 / 年份（年份由 JS 自動產生，不用手動改） */
    footer { padding: 36px 0; border-top: 1px solid var(--border); }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .footer-sig { font-size: 13px; font-weight: 500; color: var(--heading); }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a { font-size: 12px; color: var(--muted); transition: color 0.2s; }
    .footer-links a:hover { color: var(--heading); }
    .footer-copy { font-size: 11px; color: var(--mid); }

    /* ── 響應式（手機 / 平板）──
       768px 以下：單欄、導覽改為 hamburger 選單
       769px–1024px：平板，作品改為 2 欄 */
    @media (max-width: 768px) {
      section { padding: 64px 0; }
      .wrap { padding: 0 20px; }
      .nav-inner { padding: 0 20px; }
      .nav-links { display: none; flex-direction: column; gap: 0; position: absolute; top: 58px; left: 0; right: 0; background: var(--white); border-bottom: 1px solid var(--border); padding: 8px 20px 16px; }
      .nav-links.open { display: flex; }
      .nav-links li { padding: 10px 0; border-bottom: 1px solid var(--border); }
      .nav-links li:last-child { border-bottom: none; }
      .nav-links a { font-size: 14px; text-transform: none; letter-spacing: 0.02em; color: var(--body); }
      .hamburger { display: flex; }
      #hero { padding-top: 96px; }
      .hero-grid { grid-template-columns: 1fr; gap: 40px; text-align: center; }
      .hero-visual { order: -1; }
      .hero-photo { aspect-ratio: 4/3; }
      .hero-statement { max-width: 100%; text-align: left; }
      .hero-eyebrow { justify-content: center; }
      .hero-cta { justify-content: center; }
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .about-facts { flex-direction: row; flex-wrap: wrap; }
      .about-fact { flex: 1; min-width: 120px; }
      /* Mobile: single column, fixed aspect */
      .work-grid { grid-template-columns: 1fr; gap: 12px; grid-auto-rows: 280px; }
      .work-card { }
      .work-card.featured { grid-column: span 1; grid-row: span 1; }
      /* Always show overlay text on mobile (no hover) */
      .work-overlay { opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 60%, transparent 100%); }
      .work-overlay-inner { transform: translateY(0); }
      .work-category-badge { opacity: 0; }
      .craft-grid { grid-template-columns: 1fr; }
      .contact-grid { grid-template-columns: 1fr; gap: 48px; }
      .contact-sub { max-width: 100%; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .footer-links { display: none; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .work-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 320px; }
      .work-card.featured { grid-column: span 2; grid-row: span 1; }
      .hero-grid { grid-template-columns: 1fr 1fr; gap: 48px; }
    }

    /* ── 捲動進場動畫 ──
       加了 .reveal class 的元素，預設不可見
       JS 的 initReveal() 偵測到進入畫面後加上 .visible，觸發淡入
       要調整速度，改 transition 的秒數 */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <div id="page-loader">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>

  <!-- ── Nav ── -->
  <nav>
    <div class="nav-inner">
      <span class="nav-logo">JH Studio</span>
      <button class="hamburger" aria-label="Toggle menu" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-menu">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#craft">Craft</a></li>
        <li><a href="#music">Music</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── Hero ── -->
  <section id="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div id="hero-left"></div>
        <div class="hero-visual" id="hero-visual"></div>
      </div>
    </div>
  </section>

  <!-- ── About ── -->
  <section id="about">
    <div class="wrap">
      <div class="about-grid" id="about-grid"></div>
    </div>
  </section>

  <!-- ── Work ── -->
  <section id="work">
    <div class="wrap">
      <p class="sec-label">Selected Work</p>
      <h2 class="sec-title">近期作品</h2>
      <div class="sec-rule"></div>
      <div class="work-filter">
        <button class="filter-btn active" onclick="filterWork('all', this)">All</button>
        <button class="filter-btn" onclick="filterWork('music', this)">Music 音樂</button>
        <button class="filter-btn" onclick="filterWork('design', this)">Objects 設計</button>
      </div>
      <div class="work-grid" id="work-grid"></div>
    </div>
  </section>

  <!-- ── Craft ── -->
  <section id="craft">
    <div class="wrap">
      <p class="sec-label">What I do</p>
      <h2 class="sec-title">服務項目 · Craft</h2>
      <div class="sec-rule"></div>
      <div class="craft-grid" id="craft-grid"></div>
    </div>
  </section>

  <!-- ── Music ── -->
  <section id="music">
    <div class="wrap">
      <p class="sec-label">Listen</p>
      <h2 class="sec-title">Music</h2>
      <div class="sec-rule"></div>
      <div class="music-platform-tabs" id="music-tabs"></div>
      <div class="music-embed-wrap reveal" id="music-embeds"></div>
    </div>
  </section>

  <!-- ── Clients ── -->
  <section id="clients" style="padding-top:0; padding-bottom:40px;">
    <div class="wrap">
      <p class="sec-label">Trusted by</p>
      <h2 class="sec-title">合作夥伴</h2>
      <div class="sec-rule"></div>
      <div class="clients-cloud reveal" id="clients-cloud"></div>
    </div>
  </section>

  <!-- ── Contact ── -->
  <section id="contact">
    <div class="wrap">
      <div class="contact-grid" id="contact-grid"></div>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <div class="wrap">
      <div class="footer-inner" id="footer-inner"></div>
    </div>
  </footer>

  <!-- ── Modal ── -->
  <div id="modal-overlay" onclick="closeModal()">
    <div id="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
  // ══════════════════════════════════════════════════
  // 服務項目資料（從 projects.json → craft 欄位讀取）
  // 要新增或修改服務，編輯 projects.json 的 craft 陣列
  // 欄位說明：
  //   icon     - emoji 圖示
  //   name_zh  - 中文名稱（卡片上小字）
  //   name_en  - 英文名稱（卡片上大字，也是 modal 標題）
  //   desc_zh  - 中文描述（在卡片和 modal 都會顯示）
  //   desc_en  - 英文描述（在卡片和 modal 都會顯示）
  // ══════════════════════════════════════════════════
  let CRAFT = []; // 由主程式從 JSON 載入後填入

  // ── 輔助：產生圖片 HTML ──
  // 有圖片路徑就回傳 <img>，沒有就回傳灰色佔位方塊
  function imgEl(src, alt) {
    if (!src) return '<div class="placeholder-img">' + (alt || 'Image') + '</div>';
    var safeAlt = (alt || '').replace(/"/g, '&quot;');
    return '<img src="' + src + '" alt="' + safeAlt + '" loading="lazy">';
  }

  // ══════════════════════════════════════════════════
  // Hero 首頁區塊
  // 資料來源：projects.json → hero 欄位
  // ══════════════════════════════════════════════════
  function renderHero(d) {
    const h = d.hero;
    // headline 陣列中，與 headline_em 相符的那行加斜體樣式
    const lines = h.headline.map(l => l === h.headline_em ? `<em>${l}</em>` : l).join('<br>');
    const stmtZh = h.statement_zh.replace(/\n/g, '<br>');
    const stmtEn = h.statement_en.replace(/\n/g, '<br>');

    // 左欄：標題、簡介文字、按鈕
    document.getElementById('hero-left').innerHTML = `
      <div class="hero-eyebrow">${h.eyebrow}</div>
      <h1 class="hero-headline">${lines}</h1>
      <p class="hero-statement">${stmtZh}<span>${stmtEn}</span></p>
      <a href="#music" class="hero-listen">
        <span class="hero-listen-dot"></span>${h.listen_label}
      </a>
      <div class="hero-cta">
        <a href="#work" class="btn btn-dark">View Work</a>
        <a href="#contact" class="btn btn-gray">Get in Touch</a>
      </div>`;

    // 右欄：照片輪播（支援多張，photos 陣列）
    const photos = Array.isArray(h.photos) && h.photos.length > 0
      ? h.photos : (h.photo ? [h.photo] : [null]);

    document.getElementById('hero-visual').innerHTML = `
      <div class="hero-photo" id="hero-carousel">
        ${photos.map((src, i) => `
          <div class="carousel-slide${i === 0 ? ' active' : ''}">
            ${imgEl(src, 'Jerry Hang')}
          </div>`).join('')}
        <div class="hero-photo-caption">
          <div class="hero-roles">
            ${h.roles.map(r => `<span class="hero-role-tag">${r}</span>`).join('')}
          </div>
        </div>
      </div>`;

    // 超過一張照片才啟動輪播，間隔 4 秒
    if (photos.length > 1) initCarousel('hero-carousel', 4000);
  }

  // 照片輪播邏輯
  // id = carousel 容器的 id
  // interval = 換圖間隔（毫秒），4000 = 4 秒
  function initCarousel(id, interval) {
    const el = document.getElementById(id);
    if (!el) return;
    const slides = el.querySelectorAll('.carousel-slide');
    if (slides.length < 2) return;
    let cur = 0;

    function goTo(next) {
      const leaving = slides[cur];
      const leavingImg = leaving.querySelector('img');

      // 舊圖：移除 active，加 leaving 觸發縮放離場效果
      leaving.classList.remove('active');
      leaving.classList.add('leaving');
      if (leavingImg) {
        // 重置動畫，讓 zoom in 從頭播放
        leavingImg.style.animation = 'none';
        void leavingImg.offsetHeight; // 強制 reflow，確保動畫重置生效
        leavingImg.style.animation = '';
      }

      // 1.6 秒後清掉 leaving class（配合 CSS fade 時間）
      setTimeout(() => leaving.classList.remove('leaving'), 1600);

      // 新圖：同樣重置 zoom out 動畫後顯示
      cur = next % slides.length;
      const nextImg = slides[cur].querySelector('img');
      if (nextImg) {
        nextImg.style.animation = 'none';
        void nextImg.offsetHeight;
        nextImg.style.animation = '';
      }
      slides[cur].classList.add('active');
    }

    setInterval(() => goTo(cur + 1), interval);
  }

  // ══════════════════════════════════════════════════
  // About 自我介紹區塊
  // 資料來源：projects.json → about 欄位
  // ══════════════════════════════════════════════════
  function renderAbout(d) {
    const a = d.about;
    // 最後一段文字加粗體
    const paras = a.paragraphs.map((p, i) =>
      i === a.paragraphs.length - 1 ? `<p><strong>${p}</strong></p>` : `<p>${p}</p>`
    ).join('');
    document.getElementById('about-grid').innerHTML = `
      <div class="about-text reveal">
        <p class="sec-label">About</p>
        <h2 class="sec-title" style="margin-bottom:0">${a.title_zh}</h2>
        <div class="sec-rule"></div>
        ${paras}
      </div>
      <div class="about-facts reveal">
        ${a.facts.map(f => `
          <div class="about-fact">
            <div class="about-fact-num">${f.num}</div>
            <div class="about-fact-label">${f.label_zh} · ${f.label_en}</div>
          </div>`).join('')}
      </div>`;
  }

  // ══════════════════════════════════════════════════
  // 近期作品
  // 資料來源：projects.json → works 陣列
  // 點擊卡片呼叫 openWorkModal(idx)
  // ══════════════════════════════════════════════════
  let _worksData = []; // 暫存作品資料，openWorkModal 會用到

  function renderWorks(works) {
    _worksData = works; // 存起來供 modal 使用
    document.getElementById('work-grid').innerHTML = works.map((w, idx) => `
      <div class="work-card${w.featured ? ' featured' : ''} reveal" data-cat="${w.cat}" onclick="openWorkModal(${idx})">
        ${imgEl(w.image, w.name)}
        <span class="work-category-badge badge-${w.badge_type}">${w.badge}</span>
        <div class="work-overlay">
          <div class="work-overlay-inner">
            <div class="work-overlay-badge">${w.badge}</div>
            <div class="work-overlay-name">${w.name}</div>
            <div class="work-overlay-role">${w.role}</div>
            <div class="work-overlay-date">${w.date}</div>
          </div>
        </div>
      </div>`).join('');
  }

  // ══════════════════════════════════════════════════
  // 服務項目
  // 資料來源：projects.json → craft 陣列
  // 點擊卡片呼叫 openCraftModal(idx)
  // ══════════════════════════════════════════════════
  function renderCraft() {
    document.getElementById('craft-grid').innerHTML = CRAFT.map((c, idx) => `
      <div class="craft-card reveal">
        <div class="craft-icon">${c.icon}</div>
        <p class="craft-name-zh">${c.name_zh}</p>
        <h3 class="craft-name-en">${c.name_en}</h3>
        <p class="craft-desc-zh">${c.desc_zh}</p>
        <p class="craft-desc-en">${c.desc_en}</p>
      </div>`).join('');
  }

  // ══════════════════════════════════════════════════
  // 音樂平台
  // 資料來源：projects.json → music 欄位
  // 支援 Spotify / YouTube / SoundCloud 三個平台
  // 只要在 JSON 填入對應的 ID 或 URL 就會自動嵌入
  // ══════════════════════════════════════════════════
  function renderMusic(m) {
    const platforms = [
      { key: 'spotify',    label: 'Spotify',    dot: 'dot-spotify' },
      { key: 'youtube',    label: 'YouTube',    dot: 'dot-youtube' },
      { key: 'soundcloud', label: 'SoundCloud', dot: 'dot-soundcloud' }
    ];
    // 平台切換標籤按鈕
    document.getElementById('music-tabs').innerHTML = platforms.map((p, i) => `
      <button class="platform-tab${i === 0 ? ' active' : ''}" onclick="switchPlatform('${p.key}', this)">
        <span class="platform-tab-dot ${p.dot}"></span>${p.label}
      </button>`).join('');

    // Spotify：填 spotify_playlist_id（播放清單 ID）
    const spotifyHTML = m.spotify_playlist_id
      ? `<iframe src="https://open.spotify.com/embed/playlist/${m.spotify_playlist_id}?utm_source=generator&theme=0" width="100%" height="400" frameborder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`
      : `<div class="soundcloud-card"><p>Spotify playlist ID 尚未設定</p></div>`;

    // YouTube：填 youtube_playlist_id（播放清單 ID）
    const youtubeHTML = m.youtube_playlist_id
      ? `<iframe src="https://www.youtube.com/embed/videoseries?list=${m.youtube_playlist_id}" width="100%" height="400" frameborder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`
      : `<div class="soundcloud-card"><p>YouTube playlist ID 尚未設定</p></div>`;

    // SoundCloud：填 soundcloud_url（完整頁面網址）
    const scHTML = m.soundcloud_url
      ? `<iframe width="100%" height="400" scrolling="no" frameborder="no" allow="autoplay"
          src="https://w.soundcloud.com/player/?url=${encodeURIComponent(m.soundcloud_url)}&color=%23000000&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true">
        </iframe>`
      : `<div class="soundcloud-card"><p>SoundCloud URL 尚未設定</p></div>`;

    document.getElementById('music-embeds').innerHTML = `
      <div class="music-embed active" id="embed-spotify">${spotifyHTML}</div>
      <div class="music-embed" id="embed-youtube">${youtubeHTML}</div>
      <div class="music-embed" id="embed-soundcloud">${scHTML}</div>`;
  }

  // ══════════════════════════════════════════════════
  // 合作夥伴（跑馬燈帶狀）
  // 資料來源：projects.json → clients 陣列
  // 複製一份讓捲動無縫接續
  // 跑馬燈速度：CSS 的 marquee-scroll 動畫時間（目前 48s）
  // ══════════════════════════════════════════════════
  function renderClients(clients) {
    const items = [...clients, ...clients]; // 複製兩份，到一半剛好回到起點（視覺無縫）
    document.getElementById('clients-cloud').innerHTML =
      `<div class="marquee-track">${items.map(c =>
        `<span class="client-pill">${c.name_zh} ${c.name_en}</span>`
      ).join('')}</div>`;
  }

  // ══════════════════════════════════════════════════
  // Modal 彈出視窗
  // 開啟後背景不能捲動，關閉後恢復
  // 關閉方式：點 × 按鈕、點背景遮罩、按 ESC
  // ══════════════════════════════════════════════════

  // 開啟近期作品 modal
  // idx = 作品在 _worksData 陣列中的索引（由卡片的 onclick 傳入）
  function openWorkModal(idx) {
    const w = _worksData[idx];
    if (!w) return;
    const imgHtml = w.image
      ? `<img class="modal-img" src="${w.image}" alt="${w.name.replace(/"/g, '&quot;')}">`
      : `<div class="modal-img-placeholder">${w.name}</div>`;
    document.getElementById('modal-body').innerHTML = `
      ${imgHtml}
      <div class="modal-content">
        <div class="modal-badge">${w.badge || ''}</div>
        <div class="modal-title">${w.name}</div>
        <div class="modal-meta">${w.role} · ${w.date}</div>
        ${w.note ? `<p class="modal-desc-zh">${w.note}</p>` : ''}
      </div>`;
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden'; // 防止背景捲動
  }

  // 開啟服務項目 modal
  // idx = CRAFT 陣列中的索引（由卡片的 onclick 傳入）
  function openCraftModal(idx) {
    const c = CRAFT[idx];
    if (!c) return;
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-content" style="padding-top:36px;">
        <div class="modal-craft-icon">${c.icon}</div>
        <div class="modal-craft-sub">${c.name_zh}</div>
        <div class="modal-craft-title">${c.name_en}</div>
        <p class="modal-desc-zh">${c.desc_zh}</p>
        <p class="modal-desc-en">${c.desc_en}</p>
      </div>`;
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // 關閉 modal（CSS transition 自動處理淡出效果）
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = ''; // 恢復背景捲動
  }

  // 按 ESC 鍵關閉 modal
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ══════════════════════════════════════════════════
  // 聯絡區塊
  // 資料來源：projects.json → contact 欄位
  // 包含 instagram 帳號和 email
  // ══════════════════════════════════════════════════
  function renderContact(c) {
    document.getElementById('contact-grid').innerHTML = `
      <div>
        <p class="sec-label">Say hello</p>
        <h2 class="contact-headline">有任何合作<br>都歡迎聯絡。</h2>
        <p class="contact-sub">
          音樂製作、隨團音控、吉他錄音、產品設計——或者只是想聊聊，都可以。<br><br>
          Music production, live sound, session recording, product design — or just a conversation. All welcome.
        </p>
        <div class="contact-items">
          <a href="https://www.instagram.com/${c.instagram}" target="_blank" rel="noopener" class="contact-item">
            <div class="contact-item-icon">📸</div>
            <div>
              <p class="contact-item-lbl">Instagram</p>
              <p class="contact-item-val">@${c.instagram}</p>
            </div>
          </a>
          <a href="mailto:${c.email}" class="contact-item">
            <div class="contact-item-icon">✉️</div>
            <div>
              <p class="contact-item-lbl">Email</p>
              <p class="contact-item-val">${c.email}</p>
            </div>
          </a>
        </div>
      </div>
      <div class="contact-right">
        <div class="contact-note reveal">
          <strong>A note</strong>
          歡迎任何規模的合作洽詢。無論是一首歌的 session 錄音、整張專輯的製作，或是一個你腦海中的產品概念——我都很想聽。<br><br>
          I'm open to projects of any size. From a single session track to a full album — or a product idea you've had in your head for months. Tell me about it.
        </div>
      </div>`;
  }

  // ── Footer ──
  // 版權年份由 JS 自動產生，不用手動更新
  function renderFooter(c) {
    document.getElementById('footer-inner').innerHTML = `
      <span class="footer-sig">JH Studio · 黃友立 Jerry Hang</span>
      <div class="footer-links">
        <a href="https://www.instagram.com/${c.instagram}" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:${c.email}">Email</a>
      </div>
      <span class="footer-copy">© ${new Date().getFullYear()} JH Studio</span>`;
  }

  // ── 捲動進場動畫 ──
  // 使用 IntersectionObserver 監測元素是否進入畫面
  // 進入後加上 .visible class，觸發 CSS 的淡入上移效果
  // 動畫只播一次（unobserve 後就不再監聽）
  // 要調整速度：修改 CSS 的 .reveal { transition: ... }
  function initReveal() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 60); // 依序延遲，避免全部同時出現
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 }); // 元素露出 10% 就觸發
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  }

  // ── Nav 高亮 ──
  // 捲動時偵測目前位置，讓對應的導覽連結變色
  function initNav() {
    const secs = document.querySelectorAll('section[id]');
    const links = document.querySelectorAll('.nav-links a');
    window.addEventListener('scroll', () => {
      let cur = '';
      secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });
      links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${cur}`));
    }, { passive: true });
  }

  // ── 作品篩選 ──
  // cat = 'all' | 'music' | 'design'
  // 對應 projects.json 裡每個作品的 category 欄位
  // featured 卡片在 all 模式跨 2 欄，篩選後收回單欄
  function filterWork(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('#work-grid .work-card').forEach(card => {
      const show = cat === 'all' || card.dataset.cat === cat;
      card.style.display = show ? '' : 'none';
      if (cat === 'all' && card.classList.contains('featured')) {
        card.style.gridColumn = 'span 2';
      } else if (cat !== 'all' && card.classList.contains('featured')) {
        card.style.gridColumn = '';
      }
    });
  }

  // ── 音樂平台切換 ──
  // 點擊 Spotify / YouTube / SoundCloud 標籤時切換顯示的 embed
  function switchPlatform(platform, btn) {
    document.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.music-embed').forEach(e => e.classList.remove('active'));
    document.getElementById('embed-' + platform).classList.add('active');
  }

  // ── 手機版漢堡選單 ──
  function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }
  // 點擊選單連結後自動收起
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.addEventListener('click', () => document.getElementById('nav-menu').classList.remove('open'));
  });

  // ══════════════════════════════════════════════════
  // 主程式：載入 projects.json，依序渲染各區塊
  // 所有動態內容都從這個 JSON 來
  // JSON 結構：hero / about / works / music / clients / contact
  // ══════════════════════════════════════════════════
  (async () => {
    const loader = document.getElementById('page-loader');
    try {
      // 加時間戳避免瀏覽器快取到舊版 JSON
      const res = await fetch('projects.json?t=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // 依序渲染各區塊
      renderHero(data);
      renderAbout(data);
      renderWorks(data.works);
      CRAFT = data.craft || []; // 從 JSON 載入服務項目資料
      renderCraft();
      renderMusic(data.music);
      renderClients(data.clients);
      renderContact(data.contact);
      renderFooter(data.contact);

      initReveal(); // 捲動進場動畫
      initNav();    // Nav 高亮

      // 隱藏載入畫面
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 500);
    } catch (err) {
      // JSON 載入失敗時顯示錯誤提示（通常是路徑錯誤或 CORS 問題）
      console.error('[JH Studio] projects.json 讀取失敗：', err);
      loader.innerHTML = `
        <div style="text-align:center; padding:32px;">
          <p style="font-size:13px; color:#888; letter-spacing:0.04em; margin-bottom:8px;">無法載入 projects.json</p>
          <p style="font-size:11px; color:#bbb;">請確認檔案存在且與 index.html 位於同一目錄</p>
        </div>`;
    }
  })();
  </script>
</body>
</html>
